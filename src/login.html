<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Sign In | Project KIT - CSHS</title>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-white">
    <div class="flex min-h-screen items-center justify-center px-4 py-10">
      <div class="w-full max-w-md rounded-3xl border border-slate-200 bg-white p-8 shadow-xl dark:border-slate-800 dark:bg-slate-900">
        <div class="mb-8 text-center">
          <div class="mx-auto mb-4 h-14 w-14 rounded-2xl bg-brand-500 text-3xl font-bold leading-none text-white flex items-center justify-center">KIT</div>
          <h1 class="text-2xl font-semibold">Welcome back</h1>
          <p class="mt-2 text-sm text-slate-500 dark:text-slate-400">Sign in to continue to Project KIT.</p>
        </div>

        <form id="login-form" class="space-y-5">
          <div>
            <label for="login-name" class="block text-sm font-medium text-slate-700 dark:text-slate-200">Email or Username</label>
            <input id="login-name" name="name" type="text" autocomplete="username" placeholder="Enter your email or username" required class="mt-2 w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-900 outline-none transition focus:border-brand-500 focus:ring-2 focus:ring-brand-200 dark:border-slate-700 dark:bg-slate-950 dark:text-white dark:focus:border-brand-400" />
          </div>

          <div>
            <label for="login-password" class="block text-sm font-medium text-slate-700 dark:text-slate-200">Password</label>
            <input id="login-password" name="password" type="password" autocomplete="current-password" required class="mt-2 w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-900 outline-none transition focus:border-brand-500 focus:ring-2 focus:ring-brand-200 dark:border-slate-700 dark:bg-slate-950 dark:text-white dark:focus:border-brand-400" />
          </div>

          <div id="login-feedback" class="min-h-[1.5rem] text-sm text-red-600 dark:text-red-400"></div>

          <button id="login-submit" type="submit" class="w-full rounded-2xl bg-brand-500 px-4 py-3 text-sm font-semibold text-white transition hover:bg-brand-600 disabled:cursor-not-allowed disabled:opacity-60">Sign in</button>
        </form>

        <p class="mt-6 text-center text-sm text-slate-500 dark:text-slate-400">
          New to Project KIT?
          <a href="register.html" class="font-semibold text-brand-500 hover:text-brand-400">Create an account</a>
        </p>
      </div>
    </div>

    <div id="app-toast" class="hidden fixed bottom-6 right-6 z-50 rounded-xl bg-gray-900 px-4 py-3 text-sm text-white shadow-2xl transition-all duration-300 transform opacity-0 translate-y-10"></div>
  </body>
</html>
