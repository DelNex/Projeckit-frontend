<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Pending Teacher Approvals | Project KIT - CSHS</title>
  </head>
  <body
    x-data="{ 'loaded': true, 'darkMode': false, 'sidebarToggle': false }"
    :class="{'dark bg-gray-900': darkMode === true}"
  >
    <!-- preloader removed; use skeletons for in-page loading -->

    <div class="flex h-screen overflow-hidden">
      <include src="./partials/sidebar-admin.html"></include>

      <div class="relative flex flex-col flex-1 overflow-x-hidden overflow-y-auto">
        <include src="./partials/overlay.html" />
        <include src="./partials/header.html" />

        <main>
          <div class="p-4 mx-auto max-w-(--breakpoint-2xl) md:p-6 space-y-6">
            <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between border-b border-gray-200 dark:border-gray-800 pb-4">
              <div>
                <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Pending Teacher Approvals</h1>
                <p class="text-sm text-gray-500 dark:text-gray-400 mt-0.5">Review new teacher registrations, grant access, or manage active accounts.</p>
              </div>
              <div class="flex items-center gap-3">
                <a href="admin.html" class="inline-flex items-center gap-2 px-3.5 py-2 text-xs font-semibold text-gray-700 dark:text-gray-200 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl hover:bg-gray-50 dark:hover:bg-gray-700 shadow-xs transition">
                  &larr; Back to Admin Console
                </a>
              </div>
            </div>

            <!-- Table Card & Filter Bar -->
            <div class="p-5 bg-white dark:bg-gray-dark rounded-2xl border border-gray-200 dark:border-gray-800 shadow-xs space-y-4">
              <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-2 border-b border-gray-100 dark:border-gray-800">
                <div class="relative flex-1 max-w-md">
                  <input type="text" id="search-pending-teachers" placeholder="Search teacher name or email…" class="w-full pl-9 pr-4 py-2 text-xs rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-white focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20" />
                  <svg class="w-4 h-4 text-gray-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
                <div class="flex items-center gap-2">
                  <select id="filter-pending-status" class="px-3 py-2 text-xs font-semibold rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-white focus:outline-none">
                    <option value="ALL">All Statuses</option>
                    <option value="PENDING" selected>Pending Only</option>
                    <option value="APPROVED">Approved / Active</option>
                    <option value="SUSPENDED">Suspended</option>
                  </select>
                </div>
              </div>

              <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-xs">
                  <thead>
                    <tr class="border-b border-gray-200 dark:border-gray-800 bg-gray-50/50 dark:bg-gray-800/40 uppercase font-semibold text-gray-500 dark:text-gray-400">
                      <th class="px-4 py-3">Teacher / Name</th>
                      <th class="px-4 py-3">Email Address</th>
                      <th class="px-4 py-3">Registration Date</th>
                      <th class="px-4 py-3">Current Status</th>
                      <th class="px-4 py-3">Actions</th>
                    </tr>
                  </thead>
                  <tbody id="pending-users-table-body">
                    <tr><td colspan="5" class="px-4 py-6 text-center text-sm text-slate-500 dark:text-slate-400">Loading pending teachers…</td></tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </body>
</html>
