<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Recommendation Management | Project KIT - CSHS</title>
  </head>
  <body
    x-data="{ 'loaded': true, 'darkMode': false, 'sidebarToggle': false }"
    :class="{'dark bg-gray-900': darkMode === true}"
  >
    <!-- preloader removed; use skeletons for in-page loading -->

    <div class="flex h-screen overflow-hidden">
      <include src="./partials/sidebar.html"></include>

      <div class="relative flex flex-col flex-1 overflow-x-hidden overflow-y-auto">
        <include src="./partials/overlay.html" />
        <include src="./partials/header.html" />

        <main>
          <div class="p-4 mx-auto max-w-(--breakpoint-2xl) md:p-6 space-y-6">
            <div class="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
              <div>
                <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Recommendation Management</h1>
                <p class="text-sm text-gray-500 dark:text-gray-400">Create and remove recommendation codes for teachers.</p>
              </div>
            </div>

            <div class="grid gap-6 lg:grid-cols-[1.4fr_0.9fr]">
              <section class="p-6 bg-white dark:bg-gray-dark rounded-xl border border-gray-200 dark:border-gray-800 shadow-sm">
                <h2 class="text-lg font-semibold text-gray-900 dark:text-white">Create Recommendation Code</h2>
                <form id="recommendation-create-form" class="mt-4 space-y-4">
                  <div>
                    <label class="text-sm font-medium text-gray-700 dark:text-gray-300">Expiration Date</label>
                    <input id="recommendation-expiration" type="datetime-local" class="mt-2 block w-full rounded-xl border border-gray-200 bg-white px-4 py-3 text-sm text-gray-900 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 dark:border-gray-700 dark:bg-gray-900 dark:text-white" />
                  </div>
                  <button type="submit" id="recommendation-create-button" class="inline-flex items-center justify-center rounded-xl bg-indigo-600 px-4 py-3 text-sm font-semibold text-white transition hover:bg-indigo-500 disabled:cursor-not-allowed disabled:opacity-50">
                    Create recommendation
                  </button>
                </form>
              </section>

              <section class="p-6 bg-white dark:bg-gray-dark rounded-xl border border-gray-200 dark:border-gray-800 shadow-sm">
                <h2 class="text-lg font-semibold text-gray-900 dark:text-white">Live Recommendation Codes</h2>
                <div class="overflow-x-auto mt-4">
                  <table class="w-full text-left border-collapse text-xs">
                    <thead>
                      <tr class="border-b border-gray-200 dark:border-gray-800 bg-gray-50 dark:bg-gray-800/50 uppercase text-gray-400">
                        <th class="px-4 py-3">Code</th>
                        <th class="px-4 py-3">Created</th>
                        <th class="px-4 py-3">Expires</th>
                        <th class="px-4 py-3">Used</th>
                        <th class="px-4 py-3">Actions</th>
                      </tr>
                    </thead>
                    <tbody id="recommendations-table-body">
                      <tr><td colspan="5" class="px-4 py-6 text-center text-sm text-slate-500 dark:text-slate-400">Loading codes…</td></tr>
                    </tbody>
                  </table>
                </div>
              </section>
            </div>
          </div>
        </main>
      </div>
    </div>
  </body>
</html>
