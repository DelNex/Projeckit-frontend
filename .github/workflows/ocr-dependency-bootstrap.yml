name: Bootstrap pinned local OCR dependencies

on:
  push:
    branches: ["feat/projectkit-ai-omr-reports-competencies"]
    paths:
      - "package.json"
      - ".github/workflows/ocr-dependency-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ocr-dependency-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate the exact npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile only when changed
        id: commit
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: lock pinned local OCR dependencies"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Run the full project checks against the generated lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run projectkit-checks.yml --ref "${GITHUB_REF_NAME}"
          gh workflow run omr-validation.yml --ref "${GITHUB_REF_NAME}"
