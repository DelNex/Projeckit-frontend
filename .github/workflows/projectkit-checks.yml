name: Project KIT checks

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: projectkit-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run typecheck
      - name: Focused unit tests
        run: >-
          node node_modules/tsx/dist/cli.mjs --test
          src/lib/__tests__/tos-calculator.test.ts
          src/lib/__tests__/tos-item-projection.test.ts
          src/lib/server/__tests__/simple-report-pdf.test.ts
          src/lib/server/__tests__/groq-exam-worker.test.ts
          src/lib/server/__tests__/exam-ai-provider-router.test.ts
          src/lib/__tests__/local-document-engine.test.ts
