name: Refresh dependency lockfile

on:
  push:
    branches: ["perf/production-api-lazy-loading"]
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/refresh-dependency-lock.yml"

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Regenerate the exact npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - uses: actions/upload-artifact@v4
        with:
          name: projectkit-generated-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 3
