name: OMR validation

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  omr:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit and raster fixture validation
        run: npm run test:omr:unit && npm run test:omr:fixtures
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser OMR validation against every image fixture
        run: npm run test:omr:browser
