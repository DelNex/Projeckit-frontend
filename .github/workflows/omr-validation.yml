name: OMR mobile calibration

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  omr:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run OMR unit and regression tests
        run: node node_modules/tsx/dist/cli.mjs --test "src/features/omr/__tests__/*.test.ts"
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate the production OMR browser path
        run: npm run test:omr:browser
